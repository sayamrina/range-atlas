# Local stack: PostGIS metadata layer, an S3-compatible store for the lakehouse, and the API.
#   docker compose up -d db s3
#   docker compose run --rm api python -c "import boto3; boto3.client('s3').create_bucket(Bucket='atlas', CreateBucketConfiguration={'LocationConstraint': 'eu-central-1'})"
#   docker compose run --rm api python -m pipeline.run_all     # harvest + models into s3://atlas/lake
#   docker compose run --rm api python -m api.db               # load the clean layer into PostGIS
#   docker compose up api                                      # http://localhost:8000/docs
services:
  db:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_USER: range, POSTGRES_PASSWORD: range, POSTGRES_DB: range_atlas}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "range"], interval: 5s, retries: 10}
  s3:
    # S3-compatible storage for local runs (in memory; data is gone when the container stops)
    image: motoserver/moto:5.2.4
    ports: ["5000:5000"]
  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://range:range@db:5432/range_atlas
      RANGE_ATLAS_LAKE: s3://atlas/lake
      AWS_ENDPOINT_URL: http://s3:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-central-1
      RANGE_ATLAS_RUN_BACKEND: local
      CORS_ORIGINS: http://localhost:5173
    volumes: ["cache:/data/cache"]
    ports: ["8000:8000"]
volumes:
  cache:
