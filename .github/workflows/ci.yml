# Tests on every push and pull request: pipeline and API (against a real PostGIS), the web app and the Docker image.
name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: range, POSTGRES_PASSWORD: range, POSTGRES_DB: range_atlas_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U range" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://range:range@localhost:5432/range_atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check pipeline api tests
      - run: pytest
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: web
        run: npm ci && npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t range-atlas .
      - run: docker compose config --quiet
